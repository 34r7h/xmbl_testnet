name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci

    # xid's build:wasm (Docker: Dockerfile.swarm pins emscripten/emsdk:3.1.51 for the
    # same build) needs `emcc` on PATH -- without it, `npm run test:integration` fails
    # at exit 127 (`emcc: command not found`) BEFORE any test runs, so nothing on this
    # repo has actually been CI-gated. Same version pin as the Docker build for a
    # consistent build environment.
    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: 3.1.51
    
    - name: Run linter
      run: npm run lint || true
    
    - name: Run integration tests
      run: npm run test:integration
    
    - name: Run module tests
      run: |
        for dir in xid xn xclt xvsm xpc xsc xcli; do
          if [ -d "$dir" ] && [ -f "$dir/package.json" ]; then
            echo "Testing $dir..."
            cd "$dir" && npm test || true && cd ..
          fi
        done

